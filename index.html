<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shapinho.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shape Express - Elite Performance Tracking</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app-theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
          var mode = localStorage.getItem('app-mode');
          if (mode) document.documentElement.setAttribute('data-mode', mode);
          var radius = localStorage.getItem('app-radius');
          if (radius) document.documentElement.setAttribute('data-radius', radius);
          var gradients = localStorage.getItem('app-gradients');
          if (gradients) document.documentElement.setAttribute('data-gradients', gradients);
          var textSize = localStorage.getItem('app-text-size');
          if (textSize) document.documentElement.setAttribute('data-text-size', textSize);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
